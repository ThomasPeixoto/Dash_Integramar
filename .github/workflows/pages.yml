# ---------------------------------------------------------------------------
# Publica public/ no GitHub Pages.
#
# Nao ha etapa de build: o site sao os arquivos como estao no repositorio.
# Este workflow so empacota public/ e entrega ao Pages.
#
# Exige, uma vez: Settings > Pages > Source = "GitHub Actions".
# ---------------------------------------------------------------------------
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# cancel-in-progress: true — num site de publicação só a última versão
# importa. Com `false` (o padrão do workflow inicial do GitHub, pensado para
# não interromper um deploy de produção em curso) uma execução presa em
# `waiting` segurava todas as seguintes na fila indefinidamente.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
